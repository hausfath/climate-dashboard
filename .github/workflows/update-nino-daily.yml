name: Afternoon Niño 3.4 Update

# NCEI posts yesterday's preliminary OISST file ~13:30 UTC, hours after
# the 6 AM UTC main run — which leaves the daily Niño 3.4 index a day
# behind sites that update in the afternoon (e.g. Climate Reanalyzer).
# This lightweight top-up refreshes only data/nino34_daily.csv.

on:
  schedule:
    - cron: '0 15 * * *'
    # TEMPORARY (2026-09-16 → 2026-09-30): extra runs while Niño 3.4 is
    # within ~0.1 °C of its daily record. NCEI posts at 13:31 UTC with
    # remarkable regularity (13:31:24–13:31:31 on 9–14 Sep 2026), but
    # GitHub cron can start 10–40 min late and NCEI occasionally posts
    # later in the day, so: one run just after the usual posting time and
    # two catch-ups. These schedules self-disable after 2026-09-30 via the
    # expiry step below; delete the three lines when tidying up.
    - cron: '45 13 * * *'
    - cron: '30 17 * * *'
    - cron: '30 21 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # Temporary extra schedules (see `on.schedule`) stop doing work after
      # 2026-09-30; the standard 15 UTC run and manual dispatch are unaffected.
      - name: Expiry check for temporary extra schedules
        id: expiry
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && \
             [ "${{ github.event.schedule }}" != "0 15 * * *" ] && \
             [ "$(date -u +%Y%m%d)" -gt 20260930 ]; then
            echo "Temporary schedule '${{ github.event.schedule }}' expired 2026-09-30 — skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.expiry.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.expiry.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.expiry.outputs.skip != 'true'
        run: |
          pip install --upgrade pip
          # scipy: xarray backend for ERDDAP's NetCDF3 responses
          pip install requests pandas numpy xarray netCDF4 scipy

      - name: Update daily Niño 3.4 / RONI
        if: steps.expiry.outputs.skip != 'true'
        timeout-minutes: 30
        run: |
          python -m src.nino_daily

      - name: Refresh daily Niño CSV downloads
        if: steps.expiry.outputs.skip != 'true'
        run: |
          python -m src.export_data --nino-daily

      # C3S publishes its coordinated multi-system release on the 10th at
      # 12 UTC — after the 6 UTC morning cron. This 15 UTC run catches it
      # the same afternoon, but only on the 10th and only while systems
      # are still on the prior month's init (same guard as run.py).
      - name: Catch same-day C3S release (10th only)
        if: ${{ !cancelled() && steps.expiry.outputs.skip != 'true' }}
        timeout-minutes: 45
        env:
          # the C3S fetcher reads these env vars (not ~/.cdsapirc)
          CDS_API_KEY: ${{ secrets.CDS_KEY }}
          CDS_API_URL: ${{ secrets.CDS_URL }}
        run: |
          if [ "$(date -u +%d)" != "10" ]; then
            echo "Not the 10th — skipping C3S release check"
            exit 0
          fi
          python << 'PYEOF'
          import glob, os, sys
          from datetime import date
          import pandas as pd
          sys.path.insert(0, '.')
          sys.path.insert(0, 'ENSO')
          files = sorted(glob.glob('ENSO/data/forecasts/C3S/*.csv'))
          floor = date.today().replace(day=1).isoformat()
          stale = True
          if files:
              latest = pd.read_csv(files[-1])
              if not latest.empty and 'init_date' in latest.columns:
                  stale = (latest['init_date'].astype(str) < floor).any()
          if not stale:
              print('C3S already fully on current-month inits — nothing to do')
          else:
              from enso_forecast.fetchers.c3s import save_c3s
              # force=True: the 6 UTC cron already wrote today's file, and
              # save_c3s's same-day idempotency check would otherwise skip.
              # The init-date staleness guard above is what gates this
              # fetch, and save_c3s itself refuses regressions (never
              # saves fewer current-month models than the existing file).
              save_c3s(force=True)
              csvs = sorted(glob.glob('ENSO/data/forecasts/C3S/*.csv'))
              if len(csvs) > 1 and os.path.getsize(csvs[-1]) > 10:
                  for old in csvs[:-1]:
                      os.unlink(old)
                      print(f'removed older {old}')
          PYEOF

      - name: Check for changes
        id: git-check
        if: steps.expiry.outputs.skip != 'true'
        run: |
          git diff --quiet -- data/nino34_daily.csv data/nino34_daily_history.csv ENSO/data/forecasts/C3S || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: ${{ steps.git-check.outputs.changes == 'true' }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/nino34_daily.csv data/nino34_daily_history.csv assets/data/nino_daily_years_*.csv ENSO/data/forecasts/C3S
          git commit -m "Afternoon Niño 3.4 update $(date -u +'%Y-%m-%d')"
          git pull --rebase
          git push
